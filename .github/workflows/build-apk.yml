name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already ship the Android SDK; just make sure the pieces we need exist.
      - name: Prepare Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
          which java
          java -version

      - name: Build APKs (release + debug)
        run: |
          # Gradle 8.9 / Kotlin 2.0 cannot run on newer JDKs, so force JDK 17 explicitly.
          # Android Studio can generate a daemon-JVM file that requests JDK 25, which Gradle 8.9 /
          # Kotlin 2.0 can't run on. CI uses JDK 17, so ignore that file here.
          rm -f gradle/gradle-daemon-jvm.properties
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          gradle :app:assembleRelease :app:assembleDebug --stacktrace --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload release APK (minified)
        uses: actions/upload-artifact@v4
        with:
          name: UniLink-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Unminified fallback: if the minified build ever misbehaves, install this one instead.
      - name: Upload debug APK (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: UniLink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "UniLink-${GITHUB_REF_NAME}.apk"
          sha256sum "UniLink-${GITHUB_REF_NAME}.apk" > "UniLink-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "UniLink-${GITHUB_REF_NAME}.apk" \
            "UniLink-${GITHUB_REF_NAME}.apk.sha256" \
            --title "UniLink Android ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
