name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already ship the Android SDK; just make sure the pieces we need exist.
      - name: Prepare Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
          which java
          java -version

      # The private release key lives only in GitHub Secrets (never in the repository).
      - name: Prepare release signing key
        env:
          KEYSTORE_B64: ${{ secrets.UNILINK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/unilink-release.jks"
            echo "UNILINK_KEYSTORE_FILE=$RUNNER_TEMP/unilink-release.jks" >> "$GITHUB_ENV"
            echo "Release key loaded."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Secret UNILINK_KEYSTORE_B64 is missing: refusing to publish a release signed with the public debug key."
            exit 1
          else
            echo "No release key available: the release APK is signed with the public debug key (testing only)."
          fi

      - name: Build APKs (release + debug)
        env:
          UNILINK_KEYSTORE_PASSWORD: ${{ secrets.UNILINK_KEYSTORE_PASSWORD }}
          UNILINK_KEY_ALIAS: ${{ secrets.UNILINK_KEY_ALIAS }}
          UNILINK_KEY_PASSWORD: ${{ secrets.UNILINK_KEY_PASSWORD }}
        run: |
          # Gradle 8.9 / Kotlin 2.0 cannot run on newer JDKs, so force JDK 17 explicitly.
          # Android Studio can generate a daemon-JVM file that requests JDK 25, which Gradle 8.9 /
          # Kotlin 2.0 can't run on. CI uses JDK 17, so ignore that file here.
          rm -f gradle/gradle-daemon-jvm.properties
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          gradle :app:assembleRelease :app:assembleDebug --stacktrace --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      # Never publish an APK signed with the public debug key.
      - name: Verify signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signer.txt
          REL=$(grep -m1 "certificate SHA-256 digest" signer.txt | awk '{print $NF}')
          DBG=$(keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey | grep -m1 "SHA256:" | awk '{print tolower($2)}' | tr -d ':')
          echo "release=$REL"
          echo "debug=$DBG"
          if [ -z "$REL" ] || [ "$REL" = "$DBG" ]; then
            echo "::error::The release APK is signed with the public debug key (or unsigned). Refusing to publish."
            exit 1
          fi
          echo "SIGNER_SHA256=$REL" >> "$GITHUB_ENV"

      - name: Upload release APK (minified)
        uses: actions/upload-artifact@v4
        with:
          name: UniLink-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Unminified fallback: if the minified build ever misbehaves, install this one instead.
      - name: Upload debug APK (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: UniLink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # R8 mapping: needed to read obfuscated stack traces from the minified release build.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: UniLink-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "UniLink-${GITHUB_REF_NAME}.apk"
          sha256sum "UniLink-${GITHUB_REF_NAME}.apk" > "UniLink-${GITHUB_REF_NAME}.apk.sha256"
          cp RELEASE_NOTES.md release-notes.md
          printf '\n**Signing certificate SHA-256:** `%s`\n' "$SIGNER_SHA256" >> release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "UniLink-${GITHUB_REF_NAME}.apk" \
            "UniLink-${GITHUB_REF_NAME}.apk.sha256" \
            --title "UniLink Android ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
